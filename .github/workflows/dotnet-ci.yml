name: .NET CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read

concurrency:
  group: dotnet-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true

    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        global-json-file: global.json

    - name: Restore and audit dependencies
      run: dotnet restore -p:NuGetAudit=true -p:NuGetAuditMode=all -p:WarningsAsErrors=NU1901%3BNU1902%3BNU1903%3BNU1904

    - name: Report vulnerable packages
      run: dotnet package list --vulnerable --include-transitive --no-restore

    - name: Build with warnings as errors
      run: dotnet build --no-restore --configuration Release -warnaserror

    - name: Verify changed C# formatting
      shell: bash
      run: |
        if [[ "${{ github.event_name }}" == "pull_request" ]]; then
          base_sha="${{ github.event.pull_request.base.sha }}"
        else
          base_sha="${{ github.event.before }}"
        fi

        mapfile -t changed_cs < <(git diff --name-only --diff-filter=ACMR "$base_sha" HEAD -- '*.cs')
        if (( ${#changed_cs[@]} == 0 )); then
          echo "No changed C# files to format-check."
          exit 0
        fi

        printf 'Checking formatting for %s\n' "${changed_cs[@]}"
        dotnet format whitespace --verify-no-changes --no-restore --include "${changed_cs[@]}"

    - name: Test with coverage
      run: dotnet test --no-build --configuration Release --collect:"XPlat Code Coverage" --results-directory TestResults --verbosity normal

    - name: Upload coverage
      uses: actions/upload-artifact@v7
      with:
        name: coverage-${{ github.run_number }}
        path: '**/TestResults/**/coverage.cobertura.xml'
        if-no-files-found: error
        retention-days: 14

    - name: Build Docker image
      run: docker build --file src/SimplePersonalFinance.API/Dockerfile --tag simple-personal-finance:test src

    - name: Validate Docker Compose
      run: |
        docker compose --env-file infra/.env.example -f infra/docker-compose.yml config --quiet
        docker compose --env-file infra/.env.example -f infra/docker-compose.dev.yml config --quiet
