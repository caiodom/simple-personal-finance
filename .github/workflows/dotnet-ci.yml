name: .NET CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: 10.0.x

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --no-restore --configuration Release

    - name: Test
      run: dotnet test --no-build --configuration Release --verbosity normal

    - name: Build Docker image
      run: docker build --file src/SimplePersonalFinance.API/Dockerfile --tag simple-personal-finance:test src

    - name: Validate Docker Compose
      run: |
        docker compose --env-file infra/.env.example -f infra/docker-compose.yml config --quiet
        docker compose --env-file infra/.env.example -f infra/docker-compose.dev.yml config --quiet
