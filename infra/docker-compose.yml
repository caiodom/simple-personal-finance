services:
  spf-db:
    image: postgres:17.11-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
    volumes:
      - spf-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - app-network

  spf-seq:
    image: datalust/seq:2026.1.17114
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
    ports:
      - "127.0.0.1:5341:80"
    networks:
      - app-network

  cert-generator:
    image: alpine/openssl:3.5.8
    restart: "no"
    entrypoint: ["openssl"]
    command:
      - req
      - -x509
      - -nodes
      - -days
      - "365"
      - -newkey
      - rsa:2048
      - -keyout
      - /out/localhost.key
      - -out
      - /out/localhost.crt
      - -subj
      - /CN=localhost
    volumes:
      - ./certs:/out
    networks:
      - app-network

  spf-migrate:
    image: simple-personal-finance-api:local
    build:
      context: ../src
      dockerfile: ./SimplePersonalFinance.API/Dockerfile
    restart: "no"
    command: ["--migrate"]
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      ConnectionStrings__DefaultConnection: "Server=spf-db;Database=${POSTGRES_DB};User Id=${POSTGRES_USER};Password=${POSTGRES_PASSWORD};"
      Jwt__Key: ${JWT_KEY:?JWT_KEY is required}
    depends_on:
      spf-db:
        condition: service_healthy
    networks:
      - app-network

  spf-api:
    image: simple-personal-finance-api:local
    build:
      context: ../src
      dockerfile: ./SimplePersonalFinance.API/Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      ASPNETCORE_URLS: http://+:80
      ConnectionStrings__DefaultConnection: "Server=spf-db;Database=${POSTGRES_DB};User Id=${POSTGRES_USER};Password=${POSTGRES_PASSWORD};"
      Jwt__Key: ${JWT_KEY:?JWT_KEY is required}
    depends_on:
      spf-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent --show-error http://localhost:80/api/health/ready > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    networks:
      - app-network

  spf-nginx:
    image: nginx:1.30.4-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/spf.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      cert-generator:
        condition: service_completed_successfully
      spf-api:
        condition: service_healthy
    networks:
      - app-network

volumes:
  spf-db-data:

networks:
  app-network:
    driver: bridge
