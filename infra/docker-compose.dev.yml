services:
  spf-db:
    image: postgres:17.11-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - spf-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - app-network

  adminer:
    image: adminer:5.5.1
    restart: unless-stopped
    ports:
      - "127.0.0.1:33133:8080"
    depends_on:
      spf-db:
        condition: service_healthy
    networks:
      - app-network

  spf-seq:
    image: datalust/seq:2026.1.17114
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
    ports:
      - "127.0.0.1:5341:80"
    networks:
      - app-network

volumes:
  spf-db-data:

networks:
  app-network:
    driver: bridge
